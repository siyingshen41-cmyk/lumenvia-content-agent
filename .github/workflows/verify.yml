name: Verify LumenVia
on:
  push:
    branches: [feature/compliance-trust-gate]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          LLM_ENABLED: 'false'
          DEMO_INJECT_VIOLATION: 'false'
